name: 内核构建流程

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: "main"
      custom_suffix:
        required: false
        type: string
        default: ""
      build_time:
        required: false
        type: string
        default: "N"

jobs:
  build-kernel:
    name: "6.6.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-ReSukiSU-Ultra"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "        ReSukiSU-Ultra 内核构建"
          echo "========================================"
          echo "内核版本  : ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
          echo "补丁级别  : ${{ inputs.os_patch_level }}"
          echo "KSU 分支  : ReSukiSU-Ultra (${{ inputs.ksu_branch }})"
          echo "SUSFS     : ${{ inputs.enable_susfs }}"
          echo "========================================"

      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          tool-cache: true
          docker-images: false
          swap-storage: true
          rm-packages: false

      - name: 检出代码仓库
        uses: actions/checkout@v7
        with:
          path: .github

      - name: 安装编译依赖
        run: |
          set -e
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends aria2 \
            binutils python-is-python3 libssl-dev libelf-dev libzstd-dev \
            bison flex bc kmod cpio zstd rsync ccache \
            device-tree-compiler lz4 \
            clang llvm lld \
            build-essential

      - name: 恢复 bazel 磁盘缓存
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel
          key: bazel-android15-6.6-${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-${{ github.run_id }}
          restore-keys: |
            bazel-android15-6.6-${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-
            bazel-android15-6.6-${{ inputs.sub_level }}-
            bazel-android15-6.6-

      - name: 初始化并同步内核源码
        run: |
          set -e
          mkdir -p build/repo
          cd build/repo

          # 使用 ustc 镜像替代 gerrit（原 URL 连接超时）
          curl -s "https://mirrors.ustc.edu.cn/git-repo/repo" > repo
          chmod +x repo

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            FORMATTED_BRANCH="android15-6.6-2025-03"
            MANIFEST_BRANCH="common-android15-6.6-2025-03"
          else
            FORMATTED_BRANCH="android15-6.6-2026-01"
            MANIFEST_BRANCH="common-android15-6.6-2026-01"
          fi

          echo "repo init: ${MANIFEST_BRANCH}"
          ./repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${MANIFEST_BRANCH} --repo-rev=v2.16

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            sed -i 's/revision="android15-6.6-2025-03"/revision="deprecated\/android15-6.6-2025-03"/' .repo/manifests/default.xml
            echo "manifest: common -> deprecated/android15-6.6-2025-03"
          fi

          echo "repo sync..."
          ./repo sync -c -j$(nproc --all) --no-tags --fail-fast
          git -C common remote -v | head -2
          test -f common/Makefile && echo "common/Makefile OK"
